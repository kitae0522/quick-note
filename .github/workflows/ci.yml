name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  macos:
    name: macOS checks and Apple Silicon package
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check source, formatting, Clippy and behavior
        run: ./scripts/check.sh
      - name: Build macOS app
        run: ./scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Quick Note.app" dist/Quick-Note-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Quick-Note-macos-arm64
          path: dist/Quick-Note-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows checks and x64 package
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check all targets and diagnostic tools
        run: cargo check --locked --all-targets --all-features
      - name: Test storage, search, shortcuts and input policies
        run: cargo test --locked --all-features --lib --test text_search --test shortcuts --test find_shortcuts --test ime_policies
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Quick-Note-windows-x64
          path: dist/Quick-Note-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7
