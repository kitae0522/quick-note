[package]
name = "quick-note"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.95"
default-run = "quick-note"
description = "A local-first notebook for macOS and Windows with immediate saving."
repository = "https://github.com/kitae0522/quick-note"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wgpu"] }
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
egui_commonmark_backend = { version = "0.26.0", default-features = false }
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
skrifa = "0.44.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
uuid = { version = "1.0", features = ["v4"] }
directories = "6.0"
rfd = { version = "0.17.2", default-features = false }
unicode-segmentation = "1.13"
open = "5.4"
tempfile = "3.0"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
caseless = "0.2.2"
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSData", "NSBundle"] }
smappservice-rs = "0.1.3"
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["UI_ViewManagement"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey = "0.8.0"

[features]
diagnostics = ["dep:image"]

[[bin]]
name = "native-check"
path = "tools/native-check.rs"
required-features = ["diagnostics"]

[[bin]]
name = "resource-workload"
path = "tools/resource_workload.rs"
required-features = ["diagnostics"]

[[bin]]
name = "performance-probe"
path = "tools/performance_probe.rs"
required-features = ["diagnostics"]

[[bin]]
name = "startup-probe"
path = "tools/startup_probe.rs"
required-features = ["diagnostics"]

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
egui_system_font_provider = "0.37.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[patch.crates-io]
egui = { path = "vendor/egui" }
epaint = { path = "vendor/epaint" }
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
winit = { path = "vendor/winit" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
wildcard_imports = "deny"
unwrap_used = "deny"
